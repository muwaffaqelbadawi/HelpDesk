<form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
  <p-card [header]="'AUTH.CHANGE_PASSWORD.TITLE' | translate" [style]="{ width: '360px' }">
    <div class="field">
      <label for="currentPassword">
        {{ 'AUTH.CHANGE_PASSWORD.CURRENT_PASSWORD' | translate }}
      </label>

      <input id="currentPassword" pInputText type="password" formControlName="currentPassword" class="w-full"
        name="currentPassword" [placeholder]="'AUTH.CHANGE_PASSWORD.TYPE_PASSWORD' | translate" />
    </div>

    <div class="field">
      <label for="newPassword">
        {{ 'AUTH.CHANGE_PASSWORD.NEW_PASSWORD' | translate }}
      </label>

      <input id="newPassword" pInputText type="password" formControlName="newPassword" class="w-full" name="newPassword"
        [placeholder]="'AUTH.CHANGE_PASSWORD.TYPE_PASSWORD' | translate" />
    </div>

    <div class="change-password-button">
      <p-button type="submit" [label]="'AUTH.CHANGE_PASSWORD.SUBMIT' | translate" styleClass="w-full"
        [disabled]="changePasswordForm.invalid" />
    </div>
  </p-card>
</form>
