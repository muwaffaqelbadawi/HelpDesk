<form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
  <p-card [header]="'AUTH.RESET_PASSWORD.TITLE' | translate" [style]="{ width: '360px' }">
    <div class="field">
      <label for="newPassword">
        {{ 'AUTH.RESET_PASSWORD.NEW_PASSWORD' | translate }}
      </label>

      <input id="newPassword" type="password" pInputText formControlName="newPassword" class="w-full" name="newPassword"
        [placeholder]="'AUTH.RESET_PASSWORD.TYPE_PASSWORD' | translate" />
    </div>

    <div class="reset-password-button">
      <p-button type="submit" [label]="'AUTH.RESET_PASSWORD.SUBMIT' | translate" styleClass="w-full"
        [disabled]="resetPasswordForm.invalid" />
    </div>
  </p-card>
</form>
