services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: helpdesk-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "1433:1433"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    volumes:
      - sqlserver_data:/var/opt/mssql

    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: helpdesk-mailpit

    ports:
      - "1025:1025"
      - "8025:8025"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8025/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

volumes:
  sqlserver_data:
