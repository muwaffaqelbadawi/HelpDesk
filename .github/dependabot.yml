version: 2

updates:
  # Backend/.NET
  - package-ecosystem: "nuget"
    directory: "/Backend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "Microsoft.*"
        versions: [">=10.0.0"]
      - dependency-name: "Serilog.*"
        versions: [">=10.0.0"]
      - dependency-name: "Swashbuckle.*"
        versions: [">=10.0.0"]

  # Frontend/Angular
  - package-ecosystem: "npm"
    directory: "/Frontend/HelpDesk.Client"
    schedule:
      interval: "weekly"

    groups:
      angular:
        patterns:
          - "@angular/*"
        update-types:
          - "patch"
          - "minor"
      ngrx:
        patterns:
          - "@ngrx/*"

    ignore:
      - dependency-name: "@angular*"
        versions: [">=21.0.0"]
      - dependency-name: "@ngrx*"
        versions: [">=21.0.0"]
      - dependency-name: "@types/jasmine"
        versions: [">=6.0.0"]
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
