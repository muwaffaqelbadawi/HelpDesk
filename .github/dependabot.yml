version: 2

updates:
  # .NET
  - package-ecosystem: "nuget"
    directory: "/backend/src"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "Microsoft.*"
        versions: [">=11.0.0"]

  # Angular
  - package-ecosystem: "npm"
    directory: "/frontend/HelpDesk.Client"
    schedule:
      interval: "weekly"

    groups:
      angular:
        patterns:
          - "@angular/*"
        update-types:
          - "patch"
          - "minor"
      ngrx:
        patterns:
          - "@ngrx/*"

    ignore:
      - dependency-name: "@angular*"
        versions: [">=21.0.0"]
      - dependency-name: "@ngrx*"
        versions: [">=21.0.0"]
      - dependency-name: "primeng*"
        versions: [">=21.0.0"]
      - dependency-name: "@types/jasmine*"
        versions: [">=6.0.0"]
      - dependency-name: "@types/jasmine-core"
        versions: [">=6.0.0"]
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      - dependency-name: "@eslint/js"
        versions: [">=10.0.0"]
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "angular-eslint"
        versions: [">=21.0.0"]
