name: .NET CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  workflow_dispatch:

env:
  SQLSERVER_HOST_PORT: 11433

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.404

      - name: Restore dependencies
        working-directory: src/backend
        run: dotnet restore HelpDesk.slnx

      - name: Build
        working-directory: src/backend
        run: dotnet build HelpDesk.slnx --no-restore --configuration Release --verbosity normal

      - name: Start SQL Server
        run: |
          sqlserver_container_name="helpdesk-sqlserver-ci-${GITHUB_RUN_ID:-local}-${RANDOM}"
          echo "SQLSERVER_CONTAINER_NAME=$sqlserver_container_name" >> "$GITHUB_ENV"

          docker run -d \
            --name "$sqlserver_container_name" \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="${{ secrets.SQLSERVER_SA_PASSWORD }}" \
            -p "${SQLSERVER_HOST_PORT}:1433" \
            mcr.microsoft.com/mssql/server:2025-latest

      - name: Wait for SQL Server
        run: |
          for i in {1..60}; do
            if docker exec "$SQLSERVER_CONTAINER_NAME" \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost \
              -U sa \
              -P "${{ secrets.SQLSERVER_SA_PASSWORD }}" \
              -C \
              -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready."
              exit 0
            fi

            echo "Waiting for SQL Server... ($i/30)"
            sleep 2
          done

          echo "SQL Server failed to become ready."
          docker logs "$SQLSERVER_CONTAINER_NAME"
          exit 1

      - name: Show .NET SDK
        run: |
          dotnet --version
          dotnet --list-sdks
          dotnet --info

      - name: Test
        working-directory: src/backend
        env:
          ConnectionStrings__IntegrationTestConnection: >-
            Server=localhost,${{ env.SQLSERVER_HOST_PORT }};
            Database=HelpDesk_IntegrationTests;
            User Id=sa;
            Password=${{ secrets.SQLSERVER_SA_PASSWORD }};
            TrustServerCertificate=True;

          ConnectionStrings__AppDBConnection: >-
            Server=localhost,${{ env.SQLSERVER_HOST_PORT }};
            Database=HelpDesk_IntegrationTests;
            User Id=sa;
            Password=${{ secrets.SQLSERVER_SA_PASSWORD }};
            TrustServerCertificate=True;
        run: dotnet test --solution HelpDesk.slnx --no-build --configuration Release --verbosity normal

      - name: Remove SQL Server container
        if: always()
        run: docker rm --force "$SQLSERVER_CONTAINER_NAME"
