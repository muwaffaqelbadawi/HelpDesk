name: Integration Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        working-directory: Backend
        run: dotnet restore HelpDesk.slnx

      - name: Start infrastructure
        working-directory: docker
        run: docker compose up -d --wait

      - name: Check infrastructure
        working-directory: docker
        run: docker compose ps

      - name: Wait for infrastructure
        working-directory: docker
        run: docker compose ps

      - name: Build
        working-directory: Backend
        run: dotnet build HelpDesk.slnx --no-restore --configuration Release

      - name: Run integration tests
        working-directory: Backend
        run: dotnet test HelpDesk.Tests.Integration/HelpDesk.Tests.Integration.csproj --no-build --configuration Release --verbosity normal

      - name: Stop infrastructure
        if: always()
        working-directory: docker
        run: docker compose down
