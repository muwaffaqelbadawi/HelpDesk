services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: helpdesk-sqlserver
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - "D:/HelpDesk/DockerData/:/var/opt/mssql/backup"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  helpdesk-api:
    build:
      context: .
      dockerfile: docker/api/dockerfile
    container_name: helpdesk-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Redis: ${ConnectionStrings__Redis:-redis:6379}
      ConnectionStrings__AppDBConnection: "Server=sqlserver,1433;Database=HelpDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${Jwt__Key:?Set Jwt__Key in .env before starting the API}
      Jwt__Issuer: HelpDesk.API
      Jwt__Audience: HelpDesk.Client
      Jwt__AccessTokenExpiryMinutes: "10"
      Jwt__RefreshTokenExpiryDays: "7"
      Cors__Name: Frontend
      Cors__Origins__0: ${CORS_ORIGIN:-http://localhost}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__UseSsl: "false"
      Smtp__Username: ${Smtp__Username:-}
      Smtp__Password: ${Smtp__Password:-}
      Smtp__SenderName: HelpDesk.HelpDesk
      Smtp__SenderEmail: noreply@helpdesk_test.local
      UserSession__UserSessionExpiryDays: "7"
      AttachmentStorage__RootPath: App_Data/Attachments
      DataImport__CountriesPath: src/Infrastructure/Services/DataIngestion/Importing/Importers/Countries/data/countries.json
      DataImport__TimeZonesPath: src/Infrastructure/Services/DataIngestion/Importing/Importers/Timezones/data/timezone-names.json
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error http://127.0.0.1:8080/health > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - D:/HelpDesk/docker_data/Attachments:/app/App_Data/Attachments
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend/HelpDesk.Client
      dockerfile: ../../docker/frontend/dockerfile
      target: production
    container_name: helpdesk-frontend
    ports:
      - "3000:80"
    environment:
      ANGULAR_APP_API_BASE_URL: ${ANGULAR_APP_API_BASE_URL:-http://localhost:8080}
    depends_on:
      helpdesk-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: helpdesk-mailpit
    ports:
      - "1025:1025" # Email API
      - "8025:8025" # Web API
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8025/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # messagepit:
  # image: ghcr.io/coreydaley/messagepit:latest
  # container_name: helpdesk-messagepit
  # ports:
  #   - "8200:8200" # SMS API
  #   - "8026:8025" # Web UI
  # healthcheck:
  # test:
  #   [
  #     "CMD",
  #     "wget",
  #     "--no-verbose",
  #     "--tries=1",
  #     "--spider",
  #     "http://localhost:8025/",
  #   ]
  # interval: 10s
  # timeout: 5s
  # retries: 5
  # start_period: 10s
  # environment:
  #   MP_SMTP_BIND_ADDR: ""
  #   MP_SENDGRID_BIND_ADDR: ""
  #   MP_WEBHOOK_BIND_ADDR: ""
  #   MP_TWILIO_AUTH_TOKEN: "helpdesk-local-token"
  # restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: helpdesk-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
      helpdesk-api:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: helpdesk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
      - --save
      - "300"
      - "100"
      - --save
      - "900"
      - "1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  sqlserver_data:
    external: true
    name: docker_sqlserver_data
  redis_data:
    external: true
    name: helpdesk_redis_data

networks:
  default:
    name: helpdesk_default
    driver: bridge
    attachable: true
